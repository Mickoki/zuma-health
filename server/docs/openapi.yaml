        premature:
          type: integer
          minimum: 0
        missed:
          type: integer
          minimum: 0
        mean_ms:
          type:
            - number
            - "null"
        median_ms:
          type:
            - number
            - "null"
    SurveyDelta:
      type: object
      required:
        - sleep_hours
        - fatigue
        - stress
        - mood
      properties:
        sleep_hours:
          type: number
        fatigue:
          type: number
        stress:
          type: number
        mood:
          type: number
    Comparison:
      type: object
      required:
        - reaction_delta_ms
        - reaction_delta_percent
        - memory_delta_pp
        - survey_delta
      properties:
        reaction_delta_ms:
          type:
            - number
            - "null"
          description: Current median minus baseline median
        reaction_delta_percent:
          type:
            - number
            - "null"
          description: Delta divided by baseline median times 100
        memory_delta_pp:
          type: number
          description: Current accuracy minus baseline accuracy in percentage points
        survey_delta:
          $ref: "#/components/schemas/SurveyDelta"
    Fact:
      type: object
