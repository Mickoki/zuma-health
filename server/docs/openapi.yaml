openapi: 3.1.0
info:
  title: Zuma local backend
  version: 1.0.0
  description: >-
    Trusted local desktop API without authentication. No medical diagnosis.
    Install dependencies and qwen3:8b before offline use. All server timestamps
    are UTC RFC3339. Sessions are immutable. Errors never include internal details.
servers:
  - url: http://127.0.0.1:8080
paths:
  /healthz:
    get:
      summary: Process liveness, independent of Ollama
      responses:
        '200': {description: Alive, content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}
  /readyz:
    get:
      summary: SQLite readiness, independent of Ollama
      responses:
        '200': {description: Ready, content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/model/status:
    get:
      summary: Bounded local Ollama and installed-model check
      responses:
        '200':
          description: Availability is reported as data, including when Ollama is offline
          content:
            application/json:
              schema:
                type: object
                required: [available, model_installed, model]
                properties:
                  available: {type: boolean}
                  model_installed: {type: boolean}
                  model: {type: string}
  /api/v1/profiles:
    get:
      summary: Profiles, newest first by creation time then ID
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200':
          description: Profile page
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Page'}
                  - {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Profile'}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      summary: Create profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [display_name]
              properties:
                display_name: {type: string, minLength: 1, maxLength: 100, description: Trimmed name must not be blank}
            example: {display_name: Demo crew member}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Profile'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/profiles/{id}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      summary: Profile details
      responses:
        '200': {description: Profile, content: {application/json: {schema: {$ref: '#/components/schemas/Profile'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/profiles/{id}/sessions:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      summary: History, descending performed_at then ID; empty array for existing profile without sessions
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200':
          description: Session page
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Page'}
                  - {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Session'}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      summary: Atomically save complete survey and both game results
      description: >-
        client_session_id is a client-created UUID, unique per profile. Semantically
        identical retries return 200 with the existing session, independent of key
        order and timestamp timezone. Changed data with the same UUID returns 409.
        Missing fields/null values are not zero. Maximum body 256 KiB.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SessionInput'}
            example:
              client_session_id: 123e4567-e89b-42d3-a456-426614174000
              performed_at: '2026-01-02T12:00:00Z'
              protocol_version: reaction-memory-v1
              source: synthetic
              survey: {sleep_hours: 8, fatigue: 0, stress: 2, mood: 7}
              reaction:
                trials:
                  - {outcome: valid, reaction_ms: 200}
                  - {outcome: valid, reaction_ms: 300}
                  - {outcome: missed}
              memory: {correct: 3, total: 4}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
        '200': {description: Identical retry, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/sessions/{id}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      summary: Stored source data and metadata
      responses:
        '200': {description: Session, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/sessions/{id}/report:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      summary: Calculated report with current cached explanation, without calling Ollama
      description: >-
        Baseline is the closest strictly earlier session of the same profile,
        protocol and source. Backfilled sessions can change baseline; explanations
        with an old report fingerprint are omitted. Without valid reaction trials,
        mean and median are null. No clinical scores or thresholds are used.
      responses:
        '200': {description: Report, content: {application/json: {schema: {$ref: '#/components/schemas/Report'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/sessions/{id}/report.html:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      summary: Escaped Russian HTML report for viewing and printing
      responses:
        '200': {description: Printable HTML, content: {text/html: {schema: {type: string}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/sessions/{id}/explanation:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    post:
      summary: Generate explanation separately; no request body
      description: >-
        Default timeout 120 seconds. At most one generation globally; busy returns
        409. HTTP 200 reports ready, unavailable or invalid. Only ready explanations
        are saved. Failures do not erase a cached ready explanation. Output consists
        solely of server-authored facts selected by the model, not free text.
      responses:
        '200':
          description: Generation outcome
          content:
            application/json:
              schema:
                type: object
                required: [status, explanation, report_fingerprint, baseline_session_id]
                properties:
                  status: {type: string, enum: [ready, unavailable, invalid]}
                  explanation:
                    oneOf:
                      - {$ref: '#/components/schemas/Explanation'}
                      - {type: 'null'}
                  reason: {type: string, enum: [model_unavailable, model_invalid, report_changed]}
                  report_fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
                  baseline_session_id: {$ref: '#/components/schemas/NullableID'}
        default: {$ref: '#/components/responses/Error'}
components:
  parameters:
    ID: {name: id, in: path, required: true, schema: {$ref: '#/components/schemas/ID'}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    Offset: {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
  responses:
    Error:
      description: >-
        400 malformed JSON/query/ID, unknown fields or multiple JSON values;
        404 absent resource/endpoint; 409 changed duplicate session or busy model;
        413 body larger than 256 KiB; 415 non-JSON Content-Type;
        422 missing/out-of-range domain values; 500 internal rendering/model error;
        503 storage failure. Details and prompts are not exposed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    ID: {type: string, pattern: '^[0-9a-f]{32}$'}
    NullableID: {type: [string, 'null'], pattern: '^[0-9a-f]{32}$'}
    Health: {type: object, required: [status], properties: {status: {type: string, enum: [ok, ready]}}}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
            fields: {type: object, additionalProperties: {type: string}}
    Page:
      type: object
      required: [limit, offset, total]
      properties:
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0}
        total: {type: integer, minimum: 0}
    Profile:
      type: object
      required: [id, display_name, created_at]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        display_name: {type: string}
        created_at: {type: string, format: date-time}
    Survey:
      type: object
      additionalProperties: false
      required: [sleep_hours, fatigue, stress, mood]
      properties:
        sleep_hours: {type: number, minimum: 0, maximum: 24, description: Hours slept}
        fatigue: {type: number, minimum: 0, maximum: 10, description: Higher means more fatigue}
        stress: {type: number, minimum: 0, maximum: 10, description: Higher means more stress}
        mood: {type: number, minimum: 0, maximum: 10, description: Higher means better mood}
    Trial:
      oneOf:
        - type: object
          additionalProperties: false
          required: [outcome, reaction_ms]
          properties:
            outcome: {const: valid}
            reaction_ms: {type: number, minimum: 1, maximum: 10000}
        - type: object
          additionalProperties: false
          required: [outcome]
          properties:
            outcome: {type: string, enum: [premature, missed]}
    SessionInput:
      type: object
      additionalProperties: false
      required: [client_session_id, performed_at, protocol_version, source, survey, reaction, memory]
      properties:
        client_session_id: {type: string, format: uuid}
        performed_at: {type: string, format: date-time, description: Required timezone; at most 5 minutes in the future}
        protocol_version: {const: reaction-memory-v1}
        source: {type: string, enum: [observed, synthetic]}
        survey: {$ref: '#/components/schemas/Survey'}
        reaction:
          type: object
          additionalProperties: false
          required: [trials]
          properties:
            trials: {type: array, minItems: 1, maxItems: 200, items: {$ref: '#/components/schemas/Trial'}}
        memory:
          type: object
          additionalProperties: false
          required: [correct, total]
          properties:
            correct: {type: integer, minimum: 0, description: Must not exceed total}
            total: {type: integer, minimum: 1, maximum: 1000}
    Session:
      description: SessionInput fields plus server metadata, flattened in one object
      type: object
      required: [id, profile_id, received_at, calculation_version, client_session_id, performed_at, protocol_version, source, survey, reaction, memory]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        profile_id: {$ref: '#/components/schemas/ID'}
        received_at: {type: string, format: date-time}
        calculation_version: {const: v1}
        client_session_id: {$ref: '#/components/schemas/SessionInput/properties/client_session_id'}
        performed_at: {$ref: '#/components/schemas/SessionInput/properties/performed_at'}
        protocol_version: {const: reaction-memory-v1}
        source: {$ref: '#/components/schemas/SessionInput/properties/source'}
        survey: {$ref: '#/components/schemas/Survey'}
        reaction: {$ref: '#/components/schemas/SessionInput/properties/reaction'}
        memory: {$ref: '#/components/schemas/SessionInput/properties/memory'}
    ReactionMetrics:
      type: object
      required: [valid, premature, missed, mean_ms, median_ms]
      properties:
        valid: {type: integer, minimum: 0}
        premature: {type: integer, minimum: 0}
        missed: {type: integer, minimum: 0}
        mean_ms: {type: [number, 'null']}
        median_ms: {type: [number, 'null']}
    SurveyDelta:
      type: object
      required: [sleep_hours, fatigue, stress, mood]
      properties:
        sleep_hours: {type: number}
        fatigue: {type: number}
        stress: {type: number}
        mood: {type: number}
    Comparison:
      type: object
      required: [reaction_delta_ms, reaction_delta_percent, memory_delta_pp, survey_delta]
      properties:
        reaction_delta_ms: {type: [number, 'null'], description: Current median minus baseline median}
        reaction_delta_percent: {type: [number, 'null'], description: Delta divided by baseline median times 100}
        memory_delta_pp: {type: number, description: Current accuracy minus baseline accuracy in percentage points}
        survey_delta: {$ref: '#/components/schemas/SurveyDelta'}
    Fact:
      type: object
      required: [id, category, text]
      properties:
        id: {type: string}
        category: {type: string, enum: [observations, comparisons, limitations]}
        text: {type: string, description: Authored by Go from stored/calculated data}
    Explanation:
      type: object
      required: [status, model, generated_at, observations, comparisons, limitations]
      properties:
        status: {const: ready}
        model: {type: string}
        generated_at: {type: string, format: date-time}
        observations: {type: array, minItems: 1, items: {$ref: '#/components/schemas/Fact'}}
        comparisons: {type: array, items: {$ref: '#/components/schemas/Fact'}}
        limitations: {type: array, items: {$ref: '#/components/schemas/Fact'}}
    Report:
      type: object
      required: [session_id, protocol_version, calculation_version, source, performed_at, baseline_session_id, reaction, memory_percent, survey, survey_scales, comparison, limitations, explanation]
      properties:
        session_id: {$ref: '#/components/schemas/ID'}
        protocol_version: {const: reaction-memory-v1}
        calculation_version: {const: v1}
        source: {type: string, enum: [observed, synthetic]}
        performed_at: {type: string, format: date-time}
        baseline_session_id: {$ref: '#/components/schemas/NullableID'}
        reaction: {$ref: '#/components/schemas/ReactionMetrics'}
        memory_percent: {type: number, minimum: 0, maximum: 100}
        survey: {$ref: '#/components/schemas/Survey'}
        survey_scales: {type: object, additionalProperties: {type: string}}
        comparison:
          oneOf:
            - {$ref: '#/components/schemas/Comparison'}
            - {type: 'null'}
        limitations: {type: array, items: {type: string}}
        explanation:
          oneOf:
            - {$ref: '#/components/schemas/Explanation'}
            - {type: 'null'}
