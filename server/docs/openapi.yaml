        client_session_id:
          $ref: "#/components/schemas/SessionInput/properties/client_session_id"
        performed_at:
          $ref: "#/components/schemas/SessionInput/properties/performed_at"
        protocol_version:
          const: reaction-memory-v1
        source:
          $ref: "#/components/schemas/SessionInput/properties/source"
        survey:
          $ref: "#/components/schemas/Survey"
        reaction:
          $ref: "#/components/schemas/SessionInput/properties/reaction"
        memory:
          $ref: "#/components/schemas/SessionInput/properties/memory"
    ReactionMetrics:
