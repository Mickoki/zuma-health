              schema:
                $ref: "#/components/schemas/GameRun"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/game-runs/{id}/report:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Calculated metrics/comparison and current cached explanation; no model call
      description: Baseline matches profile,game,rules,difficulty,config,source. Completed compares with completed;
        chimp mistake-limit loss compares with same outcome. Aborted is excluded. Backfill changes fingerprint
        and hides stale explanations.
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameReport"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/game-runs/{id}/report.html:
    parameters:
