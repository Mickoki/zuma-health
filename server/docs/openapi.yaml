openapi: 3.1.0
info:
  title: Zuma local backend
  version: 1.1.0
  description: Trusted local desktop API without authentication. No medical diagnosis. Install dependencies and
    qwen3:8b before offline use. All server timestamps are UTC RFC3339. Sessions are immutable. Errors never
    include internal details.
servers:
  - url: http://127.0.0.1:8080
paths:
  /healthz:
    get:
      summary: Process liveness, independent of Ollama
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      summary: SQLite readiness, independent of Ollama
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/model/status:
    get:
      summary: Bounded local Ollama and installed-model check
      responses:
        "200":
          description: Availability is reported as data, including when Ollama is offline
          content:
            application/json:
              schema:
                type: object
                required:
                  - available
                  - model_installed
                  - model
                properties:
                  available:
                    type: boolean
                  model_installed:
                    type: boolean
                  model:
                    type: string
  /api/v1/profiles:
    get:
      summary: Profiles, newest first by creation time then ID
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Profile page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Profile"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Create profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - display_name
              properties:
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: Trimmed name must not be blank
            example:
              display_name: Demo crew member
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/profiles/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Profile details
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/profiles/{id}/sessions:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: History, descending performed_at then ID; empty array for existing profile without sessions
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Session page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Atomically save complete survey and both game results
      description: client_session_id is a client-created UUID, unique per profile. Semantically identical retries
        return 200 with the existing session, independent of key order and timestamp timezone. Changed data
        with the same UUID returns 409. Missing fields/null values are not zero. Maximum body 256 KiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInput"
            example:
              client_session_id: 123e4567-e89b-42d3-a456-426614174000
              performed_at: 2026-01-02T12:00:00Z
              protocol_version: reaction-memory-v1
              source: synthetic
              survey:
                sleep_hours: 8
                fatigue: 0
                stress: 2
                mood: 7
              reaction:
                trials:
                  - outcome: valid
                    reaction_ms: 200
                  - outcome: valid
                    reaction_ms: 300
                  - outcome: missed
              memory:
                correct: 3
                total: 4
      responses:
        "200":
          description: Identical retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/sessions/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Stored source data and metadata
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/sessions/{id}/report:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Calculated report with current cached explanation, without calling Ollama
      description: Baseline is the closest strictly earlier session of the same profile, protocol and source.
        Backfilled sessions can change baseline; explanations with an old report fingerprint are omitted.
        Without valid reaction trials, mean and median are null. No clinical scores or thresholds are used.
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/sessions/{id}/report.html:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Escaped Russian HTML report for viewing and printing
      responses:
        "200":
          description: Printable HTML
          content:
            text/html:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /api/v1/sessions/{id}/explanation:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      summary: Generate explanation separately; no request body
      description: Default timeout 120 seconds. At most one generation globally; busy returns 409. HTTP 200 reports
        ready, unavailable or invalid. Only ready explanations are saved. Failures do not erase a cached ready
        explanation. Output consists solely of server-authored facts selected by the model, not free text.
      responses:
        "200":
          description: Generation outcome
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - explanation
                  - report_fingerprint
                  - baseline_session_id
                properties:
                  status:
                    type: string
                    enum:
                      - ready
                      - unavailable
                      - invalid
                  explanation:
                    oneOf:
                      - $ref: "#/components/schemas/Explanation"
                      - type: "null"
                  reason:
                    type: string
                    enum:
                      - model_unavailable
                      - model_invalid
                      - report_changed
                  report_fingerprint:
                    type: string
                    pattern: ^[0-9a-f]{64}$
                  baseline_session_id:
                    $ref: "#/components/schemas/NullableID"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/profiles/{id}/game-runs:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      summary: Atomically save one independent game run
      description: No survey or legacy reaction/memory fields required. 201 new;200 semantically identical UUID
        replay;409 changed data with same UUID per profile.1MiB limit; all events replayed before storage.
