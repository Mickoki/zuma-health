      responses:
        "200":
          description: HTML
          content:
            text/html:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /api/v1/game-runs/{id}/explanation:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      summary: Select trusted game facts through local Ollama; no request body
      description: Shares global generation slot with legacy explanations (busy409). Default120s timeout.200
        ready/unavailable/invalid; only ready saved. Failure preserves current cached explanation.
      responses:
        "200":
          description: Generation outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameExplanationOutcome"
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ID"
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    Error:
      description: 400 malformed JSON/query/ID, unknown fields or multiple JSON values; 404 absent
        resource/endpoint; 409 changed duplicate session or busy model; 413 body larger than 256 KiB; 415
        non-JSON Content-Type; 422 missing/out-of-range domain values; 500 internal rendering/model error; 503
        storage failure. Details and prompts are not exposed. New game-run requests have1MiB body limit;
        legacy requests retain256KiB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    ID:
      type: string
      pattern: ^[0-9a-f]{32}$
    NullableID:
      type:
        - string
        - "null"
      pattern: ^[0-9a-f]{32}$
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
            - ready
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
    Page:
      type: object
      required:
        - limit
        - offset
        - total
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
    Profile:
      type: object
      required:
        - id
        - display_name
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/ID"
        display_name:
          type: string
        created_at:
          type: string
          format: date-time
    Survey:
      type: object
      additionalProperties: false
      required:
        - sleep_hours
        - fatigue
        - stress
        - mood
      properties:
        sleep_hours:
          type: number
          minimum: 0
          maximum: 24
          description: Hours slept
        fatigue:
          type: number
          minimum: 0
          maximum: 10
          description: Higher means more fatigue
        stress:
          type: number
          minimum: 0
          maximum: 10
          description: Higher means more stress
        mood:
          type: number
          minimum: 0
          maximum: 10
          description: Higher means better mood
    Trial:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - outcome
            - reaction_ms
          properties:
            outcome:
              const: valid
            reaction_ms:
              type: number
              minimum: 1
              maximum: 10000
        - type: object
          additionalProperties: false
          required:
            - outcome
          properties:
            outcome:
              type: string
              enum:
                - premature
                - missed
    SessionInput:
      type: object
      additionalProperties: false
      required:
        - client_session_id
        - performed_at
        - protocol_version
        - source
        - survey
        - reaction
        - memory
      properties:
        client_session_id:
          type: string
          format: uuid
        performed_at:
          type: string
          format: date-time
          description: Required timezone; at most 5 minutes in the future
        protocol_version:
          const: reaction-memory-v1
        source:
          type: string
          enum:
            - observed
            - synthetic
        survey:
          $ref: "#/components/schemas/Survey"
        reaction:
          type: object
          additionalProperties: false
          required:
            - trials
          properties:
            trials:
              type: array
              minItems: 1
              maxItems: 200
              items:
                $ref: "#/components/schemas/Trial"
        memory:
          type: object
          additionalProperties: false
          required:
            - correct
            - total
          properties:
            correct:
              type: integer
              minimum: 0
              description: Must not exceed total
            total:
              type: integer
              minimum: 1
              maximum: 1000
    Session:
      description: SessionInput fields plus server metadata, flattened in one object
      type: object
      required:
        - id
        - profile_id
        - received_at
        - calculation_version
        - client_session_id
        - performed_at
        - protocol_version
        - source
        - survey
        - reaction
        - memory
      properties:
        id:
          $ref: "#/components/schemas/ID"
        profile_id:
          $ref: "#/components/schemas/ID"
        received_at:
          type: string
          format: date-time
        calculation_version:
